<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212121">
  <title>ChatGPT — AI chat demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Chat sidebar">
      <div class="sidebar-top">
        <a class="brand" href="#" aria-label="ChatGPT home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2a4 4 0 0 0-3.88 3.02 4 4 0 0 0-2.6 6.88 4 4 0 0 0 3.68 6.06A4 4 0 0 0 16 20.3a4 4 0 0 0 4.13-5.73 4 4 0 0 0-.25-6.99A4 4 0 0 0 12 3.2Z" stroke="currentColor" stroke-width="1.4"/><path d="m8.55 6.3 7.2 4.15m-10.2 2.8 7.2-4.15m-2.1 9.1v-8.3m7.8 5.5-7.2-4.15m2.1 9.1v-8.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <span>ChatGPT</span>
        </a>
        <button class="icon-button sidebar-toggle" id="sidebarToggle" type="button" aria-label="Close sidebar" title="Close sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>

      <button class="new-chat-button" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>New chat</span>
        <span class="shortcut">Ctrl K</span>
      </button>

      <div class="history-heading">Your chats</div>
      <nav class="history-list" id="historyList" aria-label="Chat history"></nav>
      <div class="sidebar-bottom">
        <button class="profile-button" id="profileButton" type="button">
          <span class="profile-avatar">S</span>
          <span class="profile-name">Shraddha</span>
          <svg class="more-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></svg>
        </button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="mobileMenuBtn" type="button" aria-label="Open sidebar" title="Open sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="model-picker" id="modelPicker" type="button" aria-haspopup="true" aria-expanded="false">
            <span>ChatGPT</span><span class="model-label">Demo</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button class="share-button" id="shareBtn" type="button" title="Copy a link to this demo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Share</span>
        </button>
      </header>

      <section class="chat-area" id="chatArea" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2a4 4 0 0 0-3.88 3.02 4 4 0 0 0-2.6 6.88 4 4 0 0 0 3.68 6.06A4 4 0 0 0 16 20.3a4 4 0 0 0 4.13-5.73 4 4 0 0 0-.25-6.99A4 4 0 0 0 12 3.2Z" stroke="currentColor" stroke-width="1.4"/><path d="m8.55 6.3 7.2 4.15m-10.2 2.8 7.2-4.15m-2.1 9.1v-8.3m7.8 5.5-7.2-4.15m2.1 9.1v-8.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </div>
          <h1>What can I help with?</h1>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer-area">
        <div class="suggestions" id="suggestions">
          <button class="suggestion" type="button" data-prompt="Help me brainstorm ideas for a weekend project">✦ <span>Make a plan</span></button>
          <button class="suggestion" type="button" data-prompt="Explain a tricky concept in simple terms">◉ <span>Explain something</span></button>
          <button class="suggestion" type="button" data-prompt="Give me a creative writing prompt">✎ <span>Write something</span></button>
        </div>
        <form class="composer" id="chatForm">
          <textarea id="userInput" rows="1" placeholder="Message ChatGPT" aria-label="Message ChatGPT"></textarea>
          <div class="composer-tools">
            <div class="tool-buttons">
              <button class="tool-button" id="attachBtn" type="button" aria-label="Attach files" title="Attach files (demo only)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-6.2 6.2a4.1 4.1 0 0 0 5.8 5.8l6.8-6.8a2.7 2.7 0 0 0-3.8-3.8l-6.4 6.4a1.3 1.3 0 0 0 1.8 1.8l5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="tool-button tools-label" id="toolsBtn" type="button" title="Tools are not connected in this demo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span>Tools</span>
              </button>
            </div>
            <button class="send-button" id="sendBtn" type="submit" aria-label="Send message" title="Send message" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0L6 11m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">This is a front-end demo. Responses are simulated and aren’t generated by ChatGPT.</p>
      </footer>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
